<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}35%{transform:translateY(-14px) rotate(-3deg)}70%{transform:translateY(-7px) rotate(2.5deg)}}

<script>
// Smooth scroll helper
function goto(id){document.getElementById(id).scrollIntoView({behavior:'smooth'})}

// Nav on scroll
window.addEventListener('scroll',()=>{
  document.getElementById('nav').classList.toggle('solid',window.scrollY>60);
});

// Intersection Observer â reveal animations
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')});
},{threshold:0.12});
document.querySelectorAll('.r,.rl,.rr').forEach(el=>obs.observe(el));

// Jar fill animation trigger
const jarObs=new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting){
    const f=document.getElementById('jar-fill');
    if(f)f.style.height='65%';
    jarObs.disconnect();
  }
},{threshold:0.5});
const jf=document.getElementById('jar-fill');
if(jf)jarObs.observe(jf.closest('section'));

// Stats counter
function animCount(el,target,suffix,dur){
  let start=null;
  const step=ts=>{
    if(!start)start=ts;
    const p=Math.min((ts-start)/dur,1);
    const ease=1-Math.pow(1-p,3);
    el.textContent=Math.round(ease*target)+(suffix||'');
    if(p<1)requestAnimationFrame(step);
    else el.textContent=target+(suffix||'');
  };
  requestAnimationFrame(step);
}
const statsObs=new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting){
    animCount(document.getElementById('c1'),2400,'',1800);
    animCount(document.getElementById('c2'),0,'',800);
    animCount(document.getElementById('c3'),60,'',1200);
    statsObs.disconnect();
  }
},{threshold:0.4});
const statsEl=document.getElementById('stats');
if(statsEl)statsObs.observe(statsEl);

// Waitlist join
function handleJoin(){
  const phone=document.getElementById('phone-inp').value.trim();
  if(!phone||phone.length<7)return;
  document.getElementById('wl-form-wrap').style.display='none';
  document.getElementById('wl-success').classList.add('show');
  spawnConfetti();
}
document.getElementById('phone-inp').addEventListener('keydown',e=>{
  if(e.key==='Enter')handleJoin();
});

function spawnConfetti(){
  const wrap=document.getElementById('confetti-wrap');
  const colors=['#FAF7EF','#F7C948','#1B2A4A','#2D7D46','rgba(255,255,255,0.85)','#B0FFD0'];
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.className='confetti-p';
    const isCircle=Math.random()>0.5;
    p.style.cssText=`
      left:${Math.random()*100}%;top:-20px;
      width:${Math.random()*10+5}px;height:${Math.random()*10+5}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      border-radius:${isCircle?'50%':'2px'};
      animation-delay:${Math.random()*1}s;
      animation-duration:${Math.random()*2+2.5}s;
    `;
    wrap.appendChild(p);
  }
  setTimeout(()=>wrap.innerHTML='',4500);
}

// Smooth anchor links
document.querySelectorAll('a[href^="#"]').forEach(a=>{
  a.addEventListener('click',e=>{
    e.preventDefault();
    const t=document.querySelector(a.getAttribute('href'));
    if(t)t.scrollIntoView({behavior:'smooth'});
  });
});
</script>
